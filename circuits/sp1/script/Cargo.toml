[package]
version = "0.1.0"
name = "eduroll-script"
edition = "2021"
default-run = "eduroll"

[[bin]]
name = "eduroll"
path = "src/bin/main.rs"

[[bin]]
name = "evm"
path = "src/bin/evm.rs"

[[bin]]
name = "vkey"
path = "src/bin/vkey.rs"

[dependencies]
sp1-sdk = { version = "6.0.1", features = ["blocking", "native-gnark"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde = { version = "1.0.200", default-features = false, features = ["derive"] }
clap = { version = "4.0", features = ["derive", "env"] }
tracing = "0.1.40"
hex = "0.4.3"
rand = "0.8"
alloy-sol-types = { workspace = true }
eduroll-lib = { path = "../lib" }
stf-core = { path = "../crates/stf-core" }
dotenv = "0.15.0"

accounts = { path = "../../../tools/accounts" }

[build-dependencies]
sp1-build = { version = "6.0.1" }
